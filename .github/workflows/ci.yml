name: CI

# ADR-031 (2026-10-02): every minute is managed by hand.
#   - A pull request into develop/main runs the WEB gates only: changes, secret-scan, qa-artifacts (always),
#     build-test, license-scan, docker-build, e2e (when code changed). A merge runs nothing: its PR already did.
#   - Everything else is a manual "Run workflow" with two inputs:
#       deploy:  staging (from develop) / prod (from main) — runs the web gates first, deploys only if green.
#       devices: android / windows / apple / all — the DEVICE legs (MAUI builds, the Release APK, the native
#                smokes). They never run on their own; the maintainer runs them periodically and before a release.
#   - No schedule.
# The gates themselves are .github/workflows/app-ci.yml (Pkg 5.4): the same reusable workflow every app calls, so the
# platform runs exactly what it ships. An app's ci.yml is this file with `uses:` pointing at the platform's tag.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the web gates are green (staging deploys from develop, prod from main)
        type: choice
        default: none
        options: [none, staging, prod]
      devices:
        description: Device legs to run (MAUI builds, Release APK, native smokes)
        type: choice
        default: none
        options: [none, android, windows, apple, all]

# Least privilege (v3 audit DEP-8); the called workflow can use no more than this.
permissions:
  contents: read

# Env L30: a new push to an open pull request cancels that PR's previous run, so a superseded run stops billing.
# A dispatched run gets a group of its own - its run id - so it is never cancelled; the deploy jobs keep their own
# groups.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/app-ci.yml
    with:
      deploy: ${{ inputs.deploy || 'none' }}
      devices: ${{ inputs.devices || 'none' }}
    secrets: inherit # the deploy hooks (RENDER_DEPLOY_HOOK_STAGING / _PROD)
